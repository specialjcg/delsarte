name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The toolchain is pinned on purpose and there is no mathlib update bot
      # (removed in 68a5d61). Do not reintroduce one: a silent mathlib bump
      # would change what the proofs mean without anyone reading the diff.
      - uses: leanprover/lean-action@v1
        with:
          # Without the cache a build starts from an empty mathlib and blows the
          # runner quota.
          use-mathlib-cache: true
          # Fails if any declaration under `Delsarte` transitively depends on an
          # axiom outside the allowlist. This catches `sorry` (`sorryAx`),
          # `native_decide` (`Lean.ofReduceBool`) and any home-rolled axiom,
          # including ones reaching in through imports. A `sorry` that compiles
          # in silence is the worst failure mode this project has.
          axiom-audit: true
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
          axiom-audit-root: "Delsarte"

      # Cheap and instant, and it also covers files the root does not import.
      - name: Check for sorry
        run: |
          ! grep -rn --include='*.lean' -E '\bsorry\b' Delsarte/

      # A bare `import Mathlib` pulls the whole library and the discipline is
      # lost silently. Every module here names the modules it needs.
      - name: Check for a bare Mathlib import
        run: |
          ! grep -rn --include='*.lean' -E '^import Mathlib$' Delsarte/ Main.lean

      # Every bound proved here is confronted with Brouwer's published table.
      # The copy is frozen in the repository and the check never reaches the
      # network: the URL already moved once, and a check that depends on someone
      # else's site is a check that breaks when they reorganise it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The cross-check reads its list of claims out of the Lean sources, so a
      # parser that quietly stopped recognising a declaration would shrink that
      # list and every check below would go on passing while covering less. This
      # step fails if any of the thirty-three cells the list held when it was
      # still maintained by hand stops being extracted, or if the three statement
      # shapes that were near-misses when the parser was written -- a cast to Q,
      # an equality, a non-binary alphabet -- stop being recognised.
      - name: Check the claim list is still derived from Lean
        run: |
          python3 tools/lean_claims.py --check

      # Fails if a bound proved here drops below a published upper bound. That
      # would be an improvement on the literature, or -- far more often -- a bug
      # in the certificate pipeline. Either way nobody should learn it from a
      # paper referee.
      - name: Cross-check bounds against Brouwer's table
        run: |
          python3 tools/crosscheck_brouwer.py

      # The block coefficients the Schrijver certificate is generated from,
      # checked against equation (7) of the paper and against the Gram identity
      # that makes the blocks positive. It imports the same `beta()` the
      # generator uses, so a drift between the formula and the shipped data
      # fails here rather than in a proof nobody reruns.
      - name: Check Schrijver's block coefficients
        run: |
          python3 tools/check_beta.py

      # The sum-of-squares identity of section 1, proved in
      # `Delsarte/Hamming/Positivity.lean`. The Lean proof covers every `n`, so
      # this adds no coverage; it is here so that the two negative controls keep
      # running. A checker that never rejects has proved nothing, and the first
      # of these controls did misfire silently until the weights were drawn away
      # from zero.
      - name: Check the section 1 sum-of-squares identity
        run: |
          python3 tools/check_quadform.py

      # The averaging identity of section 2, in the form that avoids ever naming
      # the S_n-invariant matrix `M̃` -- the object `THEOREM1.md` §6 lists as
      # unproved. Nothing in Lean states this yet, so unlike the two checks above
      # this one is the only evidence there is, which is exactly why it has to be
      # replayable by someone other than its author. `n = 8` is behind `--full`:
      # it costs 37s and exercises no shape `n = 7` does not.
      - name: Check the section 2 averaging identity
        run: |
          python3 tools/check_orbit.py

      # The bridge of `Delsarte/Hamming/Orbit.lean`, recomputed from bitmask
      # arithmetic. The Lean theorem holds for every `n`, so this adds no
      # coverage of the identity -- but the identity is invariant under
      # replacing `interDist`, because both of its sides use it, so a definition
      # that drifted from `|(X △ Y) ∩ (X △ Z)|` would keep proving the same
      # theorem about the wrong numbers. This step is what pins the statistic to
      # the one Schrijver's paper writes, and it imports nothing the Lean side
      # or the generator uses.
      - name: Check the triple counts against the orbit sums
        run: |
          python3 tools/check_triples.py

      # Orbit constancy splits in two, and `Delsarte/Hamming/Orbit.lean` proves
      # only one half: `orbitSum_permWord`, the invariance of `Σ_σ M[σv,σw]`
      # under the action, which is a reindexing of a sum over a group. The other
      # half -- that a class of pairs sharing `(|v|,|w|,|v∧w|)` is a single
      # `S_n`-orbit -- is what carries the invariance over to the statistics, and
      # no Lean file states it. So this step is the only evidence there is, like
      # `check_orbit.py` and unlike the three above it. Only transitivity is
      # measured: replaying the proved half would test nothing. The guards weaken
      # the group, or the partition, never the side being compared against.
      - name: Check that the statistic classes are single orbits
        run: |
          python3 tools/check_orbit_transitive.py
