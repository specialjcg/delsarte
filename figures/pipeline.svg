<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Le solveur propose un candidat, le noyau de Lean le verifie ou le rejette">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
<marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
</defs>
<rect width="880" height="300" fill="#0d1117"/>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,sans-serif}</style>
<path d="M172,150 H234" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a)"/>
<text x="204" y="141" text-anchor="middle" font-size="11" fill="#8b949e">candidat</text>
<path d="M392,150 H454" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a)"/>
<text x="424" y="141" text-anchor="middle" font-size="11" fill="#8b949e">certificat</text>
<path d="M612,150 H658 V69 H698" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#ok)"/>
<text x="664" y="109" text-anchor="start" font-size="11" fill="#3fb950">accepte</text>
<path d="M612,150 H658 V231 H698" fill="none" stroke="#f85149" stroke-width="1.8" marker-end="url(#no)"/>
<text x="664" y="190" text-anchor="start" font-size="11" fill="#f85149">rejette</text>
<rect x="16" y="121" width="156" height="58" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="94" y="146" text-anchor="middle" font-size="12.5" fill="#e6edf3">Solveur LP/SDP</text>
<text x="94" y="164" text-anchor="middle" font-size="11" fill="#8b949e">virgule flottante</text>
<rect x="236" y="121" width="156" height="58" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="314" y="146" text-anchor="middle" font-size="12.5" fill="#e6edf3">Arrondi exact</text>
<text x="314" y="164" text-anchor="middle" font-size="11" fill="#8b949e">en rationnels</text>
<rect x="456" y="121" width="156" height="58" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="534" y="146" text-anchor="middle" font-size="12.5" fill="#e6edf3">Noyau Lean</text>
<text x="534" y="164" text-anchor="middle" font-size="11" fill="#8b949e">produits scalaires exacts</text>
<rect x="700" y="40" width="156" height="58" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="778" y="65" text-anchor="middle" font-size="12.5" fill="#e6edf3">A(n,d) ≤ v</text>
<text x="778" y="83" text-anchor="middle" font-size="11" fill="#8b949e">théorème</text>
<rect x="700" y="202" width="156" height="58" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="778" y="236" text-anchor="middle" font-size="12.5" fill="#e6edf3">contrôle négatif</text>
<text x="16" y="284" text-anchor="start" font-size="11" fill="#8b949e">Pointillés : hors base de confiance. La flèche « rejette » compte autant que l'autre.</text>
