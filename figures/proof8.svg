<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 822" width="920" height="822" role="img" aria-label="L'arbre de preuve de A(8,2,4) = 16, de la dualite faible aux deux verifications entieres">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
</defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.n{fill:#e6edf3;font-weight:600}.s{fill:#e6edf3}.d{fill:#8b949e}.g0{animation:g0 20.0s infinite}@keyframes g0{0%,1.5%{opacity:0} 4.25%,96%{opacity:1} 100%{opacity:0}}.g1{animation:g1 20.0s infinite}@keyframes g1{0%,9.5%{opacity:0} 12.25%,96%{opacity:1} 100%{opacity:0}}.g2{animation:g2 20.0s infinite}@keyframes g2{0%,17.0%{opacity:0} 19.75%,96%{opacity:1} 100%{opacity:0}}.g3{animation:g3 20.0s infinite}@keyframes g3{0%,25.0%{opacity:0} 27.75%,96%{opacity:1} 100%{opacity:0}}.g4{animation:g4 20.0s infinite}@keyframes g4{0%,33.0%{opacity:0} 35.75%,96%{opacity:1} 100%{opacity:0}}.g5{animation:g5 20.0s infinite}@keyframes g5{0%,41.0%{opacity:0} 43.75%,96%{opacity:1} 100%{opacity:0}}.g6{animation:g6 20.0s infinite}@keyframes g6{0%,52.0%{opacity:0} 54.75%,96%{opacity:1} 100%{opacity:0}}.g7{animation:g7 20.0s infinite}@keyframes g7{0%,65.0%{opacity:0} 67.75%,96%{opacity:1} 100%{opacity:0}}.g8{animation:g8 20.0s infinite}@keyframes g8{0%,76.0%{opacity:0} 78.75%,96%{opacity:1} 100%{opacity:0}}@media (prefers-reduced-motion:reduce){.g0,.g1,.g2,.g3,.g4,.g5,.g6,.g7,.g8{animation:none}}</style>
<rect width="920" height="822" fill="#0d1117"/>
<text class="n g0" x="40" y="44" font-size="18">A(8, 2, 4) = 16</text>
<text class="d g0" x="40" y="68" font-size="12.5">Le seul cas que ce dépôt épingle des deux côtés. Chaque boîte est un théorème, avec sa ligne.</text>
<text class="d g0" x="880" y="44" font-size="12" text-anchor="end">borne haute</text>
<text class="d g6" x="880" y="68" font-size="12" text-anchor="end">borne basse</text>
<path class="g2" d="M250,182 V198" fill="none" stroke="#30363d" stroke-width="1.8" marker-end="url(#a)"/>
<path class="g3" d="M250,274 V290" fill="none" stroke="#30363d" stroke-width="1.8" marker-end="url(#a)"/>
<path class="g4" d="M250,366 V382" fill="none" stroke="#30363d" stroke-width="1.8" marker-end="url(#a)"/>
<path class="g5" d="M250,458 V474" fill="none" stroke="#30363d" stroke-width="1.8" marker-end="url(#a)"/>
<path class="g5" d="M250,550 V566" fill="none" stroke="#30363d" stroke-width="1.8" marker-end="url(#a)"/>
<path class="g6" d="M690,366 V382" fill="none" stroke="#30363d" stroke-width="1.8" marker-end="url(#a)"/>
<path class="g6" d="M690,458 V566" fill="none" stroke="#30363d" stroke-width="1.8" marker-end="url(#a)"/>
<path class="g7" d="M250,628 V648 H460 V670" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#ok)"/>
<path class="g7" d="M690,628 V648 H460 V670" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#ok)"/>
<text class="d g7" x="472" y="662" font-size="11.5">le_antisymm</text>
<rect class="g1" x="40" y="108" width="420" height="74" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text class="n g1" x="54" y="129" font-size="12.5">weak_duality</text>
<text class="s g1" x="54" y="149" font-size="13.5">c ⬝ᵥ x ≤ b ⬝ᵥ y</text>
<text class="d g1" x="54" y="167" font-size="11.5">x primal-faisable, y dual-faisable</text>
<text class="d g1" x="446" y="129" font-size="10.5" text-anchor="end">LP/WeakDuality.lean:71</text>
<rect class="g2" x="40" y="200" width="420" height="74" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text class="n g2" x="54" y="221" font-size="12.5">le_of_dualFeasible</text>
<text class="s g2" x="54" y="241" font-size="13.5">∀ x faisable, c ⬝ᵥ x ≤ b ⬝ᵥ y</text>
<text class="d g2" x="54" y="259" font-size="11.5">y n'a pas besoin d'être optimal</text>
<text class="d g2" x="446" y="221" font-size="10.5" text-anchor="end">LP/WeakDuality.lean:84</text>
<rect class="g3" x="40" y="292" width="420" height="74" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text class="n g3" x="54" y="313" font-size="12.5">intCheck_cert8_4</text>
<text class="s g3" x="54" y="333" font-size="13.5">intCheck 8 4 [0,4,1,0,…] 4 = true</text>
<text class="s g3" x="54" y="351" font-size="11.5" fill="#3fb950">by decide — entiers, au noyau</text>
<text class="d g3" x="446" y="313" font-size="10.5" text-anchor="end">Certificate/Table1.lean:44</text>
<rect class="g4" x="40" y="384" width="420" height="74" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text class="n g4" x="54" y="405" font-size="12.5">dualCert_cert8_4</text>
<text class="s g4" x="54" y="425" font-size="13.5">DualCert 8 2 4 cert8_4</text>
<text class="d g4" x="54" y="443" font-size="11.5">y₁ = 1, y₂ = 1/4</text>
<text class="d g4" x="446" y="405" font-size="10.5" text-anchor="end">Certificate/Table1.lean:46</text>
<rect class="g5" x="40" y="476" width="420" height="74" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text class="n g5" x="54" y="497" font-size="12.5">A_le_of_intCert</text>
<text class="s g5" x="54" y="517" font-size="13.5">intCheck = true → A n 2 d ≤ B</text>
<text class="d g5" x="54" y="535" font-size="11.5">via dualFeasible_of_dualCert</text>
<text class="d g5" x="446" y="497" font-size="10.5" text-anchor="end">Certificate/Integer.lean:315</text>
<rect class="g5" x="40" y="568" width="420" height="60" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text class="n g5" x="54" y="589" font-size="12.5">A_8_2_4_le</text>
<text class="s g5" x="54" y="609" font-size="13.5">A 8 2 4 ≤ 16</text>
<text class="d g5" x="446" y="589" font-size="10.5" text-anchor="end">Certificate/Table1.lean:49</text>
<rect class="g6" x="500" y="292" width="380" height="74" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text class="n g6" x="514" y="313" font-size="12.5">minWtCheck_ham8</text>
<text class="s g6" x="514" y="333" font-size="13.5">minWtCheck ham8Row 4 8 4 = true</text>
<text class="s g6" x="514" y="351" font-size="11.5" fill="#3fb950">by decide +kernel — 16 mots</text>
<text class="d g6" x="866" y="313" font-size="10.5" text-anchor="end">Code/Golay.lean:251</text>
<rect class="g6" x="500" y="384" width="380" height="74" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text class="n g6" x="514" y="405" font-size="12.5">two_pow_le_A</text>
<text class="s g6" x="514" y="425" font-size="13.5">2 ^ k ≤ A n 2 d</text>
<text class="d g6" x="514" y="443" font-size="11.5">k = 4, la matrice génératrice</text>
<text class="d g6" x="866" y="405" font-size="10.5" text-anchor="end">Code/Linear.lean:260</text>
<rect class="g6" x="500" y="568" width="380" height="60" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text class="n g6" x="514" y="589" font-size="12.5">A_8_2_4_ge</text>
<text class="s g6" x="514" y="609" font-size="13.5">16 ≤ A 8 2 4</text>
<text class="d g6" x="866" y="589" font-size="10.5" text-anchor="end">Code/Golay.lean:253</text>
<rect class="g7" x="250" y="672" width="420" height="60" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text class="n g7" x="264" y="693" font-size="12.5">A_8_2_4_eq</text>
<text class="s g7" x="264" y="713" font-size="13.5">A 8 2 4 = 16</text>
<text class="d g7" x="656" y="693" font-size="10.5" text-anchor="end">Code/Golay.lean:260</text>
<text class="d g8" x="40" y="776" font-size="11.5">Recalcul exact : dualSlack(i) = −∑ₖ yₖ·Kₖ(i), contrainte 1 ≤ dualSlack sur i ∈ [4, 8]</text>
<text class="s g8" x="40" y="794" font-size="12">i=4: 1   i=5: 5/2   i=6: 3   i=7: 5/2   i=8: 1</text>
<text class="g8" x="880" y="794" font-size="12" fill="#3fb950" text-anchor="end">bound = 1 + 8 + 7 = 16</text>
</svg>